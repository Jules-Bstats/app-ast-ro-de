[project]
name = "app-asteroide"
version = "0.1.0"
description = "Pipeline ELT sur GCP alimentée par l'API NASA NeoWs (astéroïdes proches de la Terre)"
readme = "README.md"
authors = [
    { name = "Jules", email = "jules.bouscaud2@gmail.com" }
]
requires-python = ">=3.12,<3.14"
dependencies = [
    "google-cloud-bigquery>=3.46.1",
    "google-cloud-secret-manager>=2.31.0",
    "google-cloud-storage>=3.17.0",
    "httpx>=0.28.1",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.15.0",
    "structlog>=26.1.0",
    "tenacity>=9.2.1",
]

[project.scripts]
app-asteroide = "app_asteroide:main"

[build-system]
requires = ["uv_build>=0.12.20,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "respx>=0.23.1",
    "ruff>=0.17.0",
]

# --- Qualité du code ---------------------------------------------------------

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# E/F : erreurs et fautes classiques, I : tri des imports, UP : syntaxe Python moderne,
# B : bugs courants, SIM : simplifications de code
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --cov=app_asteroide --cov-report=term-missing"

[tool.mypy]
python_version = "3.12"
disallow_untyped_defs = true
warn_return_any = true
warn_unused_ignores = true
plugins = ["pydantic.mypy"]
